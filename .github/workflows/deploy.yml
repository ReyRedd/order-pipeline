################################################################################
# CI/CD - Deploy order-pipeline on every push to main
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   AWS_ACCESS_KEY_ID      - your IAM user access key
#   AWS_SECRET_ACCESS_KEY  - your IAM user secret key
#   TF_STATE_BUCKET        - S3 bucket name for remote state
#   NOTIFICATION_EMAIL     - email for SNS notifications
################################################################################

name: Deploy Order Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:    # allows manual trigger from GitHub UI

env:
  AWS_REGION:      us-east-1
  TF_VERSION:      1.14.8

jobs:
  deploy:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Configure AWS credentials ────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── 3. Set up Terraform ─────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ── 4. Init with S3 remote backend ──────────────────────────────────────
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=order-pipeline/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      # ── 5. Validate configuration ───────────────────────────────────────────
      - name: Terraform Validate
        run: terraform validate

      # ── 6. Plan - shows what will change ────────────────────────────────────
      - name: Terraform Plan
        run: |
          terraform plan \
            -var="notification_email=${{ secrets.NOTIFICATION_EMAIL }}" \
            -out=tfplan

      # ── 7. Apply - only on push to main ─────────────────────────────────────
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      # ── 8. Print outputs ────────────────────────────────────────────────────
      - name: Show outputs
        run: terraform output
